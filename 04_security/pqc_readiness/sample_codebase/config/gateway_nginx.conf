# SampleCo Finance -- customer portal TLS termination (synthetic)
server {
    listen 443 ssl;
    server_name portal.example.com;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers ECDHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA256;
    ssl_ecdh_curve secp384r1;
    ssl_dhparam dhparam_2048.pem;
    # SSL 3.0 was switched off here after an earlier review.
}
